    listen 80;
    server_name _;

    # ---- code-server (browser VS Code) ----
    location /vscode/ {
        proxy_pass http://code-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Accept-Encoding gzip;
    }

    # ---- Guacamole (remote desktops: Ubuntu + Kali) ----
    location /desktop/ {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_buffering off;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /guacamole/ /desktop/;
        access_log off;
    }

    # ---- Simple landing page ----
    location / {
        return 200 'AllBlue Lab is running. Visit /vscode/ for the code editor or /desktop/ for remote desktops (Ubuntu + Kali).';
        add_header Content-Type text/plain;
    }
}
